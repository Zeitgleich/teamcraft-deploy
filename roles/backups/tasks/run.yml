- name: Users
  ansible.builtin.getent:
    database: passwd

- name: Run the backups now
  ansible.builtin.systemd_service:
    name: "{{ item.unit }}"
    state: started
    scope: user
  become: true
  become_user: "{{ item.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[item.user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[item.user][1] }}/bus"
  loop: "{{ [{'unit': 'teamcraft-backup-postgres.service', 'user': 'tc-db'}]
            + ([{'unit': 'teamcraft-backup-remote.service', 'user': 'tc-db'}] if backups_remote_enabled else []) }}"
