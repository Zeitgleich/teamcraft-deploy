# The playbook (docs/installing.md). Run through the justfile or with tags, e.g.
#   ansible-playbook -i inventory/hosts setup.yml --tags=install-all,start
- name: Set up TeamCraft
  hosts: teamcraft_servers
  become: true
  roles:
    - role: base
      tags: [always]
    - role: postgres
    - role: garage
    - role: keycloak
    - role: caddy
    # Without Caddy: configurations for your own proxy (docs/reverse-proxy.md).
    - role: proxy_snippets
    - role: teamcraft_server
    - role: teamcraft_sfu
    # Optional, off by default: webhooks and logs into channels (docs/components/teamcraft-bridge.md).
    - role: teamcraft_bridge
    # Optional, off by default: AI transcript and summary of calls through OpenRouter
    # (docs/components/teamcraft-notetaker.md).
    - role: teamcraft_notetaker
    - role: calcraft
    # Optional, off by default: error tracking for the apps' crash reports (docs/components/glitchtip.md).
    - role: glitchtip
    - role: backups
    # Their tasks carry their own tags (start, stop, self-check).
    - role: services
    - role: self_check

# Optional, off by default, on its own host (docs/components/push-gateway.md): only whoever publishes
# store apps runs a push gateway. Put the host in the group [teamcraft_push_gateways] of the inventory.
- name: Set up a TeamCraft push gateway
  hosts: teamcraft_push_gateways
  become: true
  roles:
    - role: push_gateway

# Optional, on a host of its own (docs/components/glitchtip.md, "On its own host"): GlitchTip with its own
# Postgres for the apps' crash reports, behind the web server the host already runs. Put the host in the
# group [teamcraft_crash_reports]; on the push gateway's machine under a second inventory name.
- name: Set up crash reports (GlitchTip) on its own host
  hosts: teamcraft_crash_reports
  become: true
  roles:
    - role: base
      tags: [always]
    - role: postgres
    - role: glitchtip
    - role: backups
    # Their tasks carry their own tags (start, stop, self-check).
    - role: services
    - role: self_check
