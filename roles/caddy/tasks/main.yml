- name: Install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [setup-all, install-all, setup-caddy, install-caddy]
  when: caddy_enabled
  tags: [setup-all, install-all, setup-caddy, install-caddy]

- name: Uninstall
  ansible.builtin.include_role:
    name: base
    tasks_from: service_remove
    apply:
      tags: [setup-all, setup-caddy]
  vars:
    base_service_name: caddy
    base_service_user: tc-proxy
  when: not caddy_enabled
  tags: [setup-all, setup-caddy]
