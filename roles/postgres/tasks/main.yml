- name: Install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [setup-all, install-all, setup-postgres, install-postgres]
  when: postgres_enabled
  tags: [setup-all, install-all, setup-postgres, install-postgres]

- name: Uninstall
  ansible.builtin.include_role:
    name: base
    tasks_from: service_remove
    apply:
      tags: [setup-all, setup-postgres]
  vars:
    base_service_name: postgres
    base_service_user: tc-db
  when: not postgres_enabled
  tags: [setup-all, setup-postgres]
