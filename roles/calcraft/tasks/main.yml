- name: Install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [setup-all, install-all, setup-calcraft, install-calcraft]
  when: calcraft_enabled
  tags: [setup-all, install-all, setup-calcraft, install-calcraft]

- name: Uninstall
  ansible.builtin.include_role:
    name: base
    tasks_from: service_remove
    apply:
      tags: [setup-all, setup-calcraft]
  vars:
    base_service_name: calcraft
    base_service_user: tc-calcraft
  when: not calcraft_enabled
  tags: [setup-all, setup-calcraft]
