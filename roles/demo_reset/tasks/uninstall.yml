- name: Units
  ansible.builtin.stat:
    path: /etc/systemd/system/teamcraft-demo-reset.timer
  register: demo_reset_timer

- name: Stop the timer
  ansible.builtin.systemd_service:
    name: teamcraft-demo-reset.timer
    enabled: false
    state: stopped
  when: demo_reset_timer.stat.exists

# The seed directory stays: it is the only copy of the seed.
- name: Remove
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/teamcraft-demo-reset.timer
    - /etc/systemd/system/teamcraft-demo-reset.service
    - /usr/local/sbin/teamcraft-demo-reset
    - /etc/teamcraft-demo-reset.env
    - /usr/local/lib/teamcraft-demo
