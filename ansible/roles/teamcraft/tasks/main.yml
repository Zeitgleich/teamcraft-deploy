- name: Load secrets
  ansible.builtin.set_fact:
    teamcraft_secrets: "{{ lookup('community.sops.sops', teamcraft_secrets_file) | from_yaml }}"
  no_log: true

- name: Install Docker
  ansible.builtin.package:
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: Create install directory
  ansible.builtin.file:
    path: "{{ teamcraft_install_dir }}"
    state: directory
    mode: "0750"

- name: Copy compose stack
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose/{{ item }}"
    dest: "{{ teamcraft_install_dir }}/{{ item }}"
    mode: "0640"
  loop:
    - docker-compose.yml
    - Caddyfile
  notify: Restart stack

- name: Render environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ teamcraft_install_dir }}/.env"
    mode: "0600"
  no_log: true
  notify: Restart stack

- name: Start stack
  community.docker.docker_compose_v2:
    project_src: "{{ teamcraft_install_dir }}"
    pull: always
    state: present
