- name: "{{ svc.name }}: service user"
  ansible.builtin.user:
    name: "{{ svc.user }}"
    shell: /usr/sbin/nologin
    create_home: true
    groups: "{{ ['tc-certs'] if svc.name in ['caddy', 'teamcraft-sfu'] else [] }}"
    append: true
  register: svc_user

- name: "{{ svc.name }}: remember uid"
  ansible.builtin.set_fact:
    teamcraft_uids: "{{ teamcraft_uids | default({}) | combine({svc.user: svc_user.uid}) }}"
    svc_env:
      XDG_RUNTIME_DIR: "/run/user/{{ svc_user.uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ svc_user.uid }}/bus"

- name: "{{ svc.name }}: keep user systemd running without login"
  ansible.builtin.command: "loginctl enable-linger {{ svc.user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ svc.user }}"

- name: "{{ svc.name }}: wait for the user's systemd instance"
  ansible.builtin.wait_for:
    path: "/run/user/{{ svc_user.uid }}/bus"
    timeout: 60

- name: "{{ svc.name }}: directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ svc.user }}"
    group: "{{ svc.user }}"
    mode: "0750"
  loop:
    - "/home/{{ svc.user }}/.config"
    - "/home/{{ svc.user }}/.config/containers"
    - "/home/{{ svc.user }}/.config/containers/systemd"
    - "/home/{{ svc.user }}/.config/teamcraft-secrets"
    - "/home/{{ svc.user }}/config"

- name: "{{ svc.name }}: podman secrets"
  ansible.builtin.shell: |
    printf '%s' "$VALUE" | podman secret create --replace {{ item }} -
  environment: "{{ svc_env | combine({'VALUE': teamcraft_secrets[item]}) }}"
  loop: "{{ svc.secrets }}"
  become: true
  become_user: "{{ svc.user }}"
  no_log: true
  changed_when: false

# podman can't tell whether a secret changed; a hash per secret can (and triggers the restart).
- name: "{{ svc.name }}: secret fingerprints"
  ansible.builtin.copy:
    content: "{{ teamcraft_secrets[item] | hash('sha256') }}\n"
    dest: "/home/{{ svc.user }}/.config/teamcraft-secrets/{{ item }}.sha256"
    owner: "{{ svc.user }}"
    group: "{{ svc.user }}"
    mode: "0600"
  loop: "{{ svc.secrets }}"
  no_log: true
  register: svc_secrets

- name: "{{ svc.name }}: configuration"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ svc.user }}/config/{{ item }}"
    owner: "{{ svc.user }}"
    group: "{{ svc.user }}"
    # World-readable: the containers run as a subordinate uid, not as the service user, and only
    # see this file through its bind mount. No secrets in here (they are podman secrets).
    mode: "0644"
  loop: "{{ svc.configs }}"
  register: svc_configs

- name: "{{ svc.name }}: web client"
  when: svc.name == 'teamcraft-server' and teamcraft_web_archive | length > 0
  block:
    - name: Web client directory
      ansible.builtin.file:
        path: /home/tc-server/web
        state: directory
        owner: tc-server
        group: tc-server
        mode: "0755"
    - name: Web client files
      ansible.builtin.unarchive:
        src: "{{ teamcraft_web_archive }}"
        dest: /home/tc-server/web
        owner: tc-server
        group: tc-server
      register: svc_web

- name: "{{ svc.name }}: Caddy data and SFU certificate export"
  when: svc.name == 'caddy'
  block:
    - name: Certificate directory (written by caddy, read by the SFU)
      ansible.builtin.file:
        path: "{{ teamcraft_cert_dir }}"
        state: directory
        owner: tc-proxy
        group: tc-certs
        mode: "0750"

    # Must exist before the container starts: it is a bind mount.
    - name: Caddy data and script directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: tc-proxy
        group: tc-proxy
        mode: "0750"
      loop: [/home/tc-proxy/caddy-data, /home/tc-proxy/bin, /home/tc-proxy/.config/systemd, /home/tc-proxy/.config/systemd/user]

    - name: Export script
      ansible.builtin.template:
        src: sfu-cert-export.sh.j2
        dest: /home/tc-proxy/bin/sfu-cert-export.sh
        owner: tc-proxy
        group: tc-proxy
        mode: "0750"

    - name: Export service and timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/home/tc-proxy/.config/systemd/user/{{ item }}"
        owner: tc-proxy
        group: tc-proxy
        mode: "0644"
      loop: [sfu-cert-export.service, sfu-cert-export.timer]

- name: "{{ svc.name }}: quadlet unit"
  ansible.builtin.template:
    src: "{{ svc.name }}.container.j2"
    dest: "/home/{{ svc.user }}/.config/containers/systemd/{{ svc.name }}.container"
    owner: "{{ svc.user }}"
    group: "{{ svc.user }}"
    mode: "0644"
  register: svc_unit

- name: "{{ svc.name }}: mark for restart"
  ansible.builtin.set_fact:
    teamcraft_changed_services: "{{ teamcraft_changed_services | default([]) + [svc.name] }}"
  when: svc_unit.changed or svc_configs.changed or svc_secrets.changed or (svc_web.changed | default(false))
  changed_when: true
  notify: Restart changed services

# Pulling the image happens on the first start; give it time on a slow line.
- name: "{{ svc.name }}: start"
  ansible.builtin.systemd_service:
    name: "{{ svc.name }}.service"
    state: started
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ svc.user }}"
  environment: "{{ svc_env }}"

- name: "{{ svc.name }}: SFU certificate"
  when: svc.name == 'caddy'
  block:
    - name: Enable the export timer
      ansible.builtin.systemd_service:
        name: sfu-cert-export.timer
        state: started
        enabled: true
        daemon_reload: true
        scope: user
      become: true
      become_user: tc-proxy
      environment: "{{ svc_env }}"

    # The SFU starts next and needs the certificate; Caddy obtains it within seconds (internal) or
    # a minute (ACME), then the export copies it over.
    - name: Wait for Caddy's SFU certificate
      ansible.builtin.wait_for:
        path: "/home/tc-proxy/caddy-data/caddy/certificates/{{ teamcraft_caddy_issuer_dirs[teamcraft_tls] }}/{{ teamcraft_sfu_domain }}/{{ teamcraft_sfu_domain }}.crt"
        timeout: 300

    - name: Export it now
      ansible.builtin.systemd_service:
        name: sfu-cert-export.service
        state: started
        scope: user
      become: true
      become_user: tc-proxy
      environment: "{{ svc_env }}"
      changed_when: false
