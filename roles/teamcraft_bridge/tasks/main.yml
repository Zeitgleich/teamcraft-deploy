- name: Install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [setup-all, install-all, setup-teamcraft-bridge, install-teamcraft-bridge]
  when: teamcraft_bridge_enabled
  tags: [setup-all, install-all, setup-teamcraft-bridge, install-teamcraft-bridge]

- name: Uninstall
  ansible.builtin.include_role:
    name: base
    tasks_from: service_remove
    apply:
      tags: [setup-all, setup-teamcraft-bridge]
  vars:
    base_service_name: teamcraft-bridge
    base_service_user: tc-bridge
  when: not teamcraft_bridge_enabled
  tags: [setup-all, setup-teamcraft-bridge]
