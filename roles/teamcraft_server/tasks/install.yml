- name: Service user
  ansible.builtin.include_role:
    name: base
    tasks_from: service_user
  vars:
    base_service:
      name: teamcraft-server
      user: tc-server
      secrets: "{{ teamcraft_server_secrets | dict2items | selectattr('value') | items2dict }}"

- name: Configuration
  ansible.builtin.template:
    src: teamcraft.toml.j2
    dest: /home/tc-server/config/teamcraft.toml
    owner: tc-server
    group: tc-server
    # Read by the container's subordinate uid through the bind mount; secrets are podman secrets.
    mode: "0644"
  register: teamcraft_server_config

- name: Web client
  when: teamcraft_server_web_enabled
  block:
    - name: Web client directory
      ansible.builtin.file:
        path: /home/tc-server/web
        state: directory
        owner: tc-server
        group: tc-server
        mode: "0755"

    # The checksum of the archive from the release's SHA256SUMS, unless teamcraft_server_web_checksum
    # gives one. Fetched by the server itself, like the archive.
    - name: Web client checksum list
      ansible.builtin.uri:
        url: "{{ teamcraft_server_web_sums_url }}"
        return_content: true
        # A release without the file fails below, with the reason.
        status_code: [200, 404]
      register: teamcraft_server_web_sums
      when: teamcraft_server_web_checksum | length == 0

    - name: Web client checksum
      ansible.builtin.set_fact:
        teamcraft_server_web_sha256: >-
          {%- if teamcraft_server_web_checksum | length > 0 -%}
          {{ teamcraft_server_web_checksum }}
          {%- else -%}
          {%- set name = teamcraft_server_web_url | basename -%}
          {%- set ns = namespace(found='') -%}
          {%- for line in (teamcraft_server_web_sums.content | default('')).splitlines() -%}
          {%- set f = line.split() -%}
          {%- if f | length == 2 and f[1].lstrip('*') == name and ns.found == '' -%}
          {%- set ns.found = 'sha256:' ~ f[0] | lower -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.found }}
          {%- endif -%}

    - name: Web client checksum found
      ansible.builtin.assert:
        that: teamcraft_server_web_sha256 is match('^sha256:[0-9a-f]{64}$')
        fail_msg: >-
          {{ teamcraft_server_web_sums_url }} {{ 'does not exist' if teamcraft_server_web_sums.status == 404
          else 'has no SHA-256 line for ' ~ (teamcraft_server_web_url | basename) }} (does release
          {{ teamcraft_version }} ship a web client?). Set teamcraft_server_web_checksum, or
          teamcraft_server_web_enabled: false for apps only.
        quiet: true
      when: teamcraft_server_web_checksum | length == 0

    - name: Web client archive
      ansible.builtin.get_url:
        url: "{{ teamcraft_server_web_url }}"
        dest: "/home/tc-server/teamcraft-web-{{ teamcraft_version }}.tar.gz"
        checksum: "{{ teamcraft_server_web_sha256 }}"
        owner: tc-server
        group: tc-server
        mode: "0644"
      register: teamcraft_server_web_archive

    # Unpacked only when a new archive was downloaded (no handler: it must happen before the restart).
    - name: Web client files  # noqa: no-handler
      ansible.builtin.unarchive:
        src: "/home/tc-server/teamcraft-web-{{ teamcraft_version }}.tar.gz"
        dest: /home/tc-server/web
        remote_src: true
        owner: tc-server
        group: tc-server
      when: teamcraft_server_web_archive.changed

- name: Brand images
  when: teamcraft_server_brand_assets_src | length > 0
  block:
    - name: Brand image directory
      ansible.builtin.file:
        path: /home/tc-server/brands
        state: directory
        owner: tc-server
        group: tc-server
        mode: "0755"

    # World-readable: read by the container's subordinate uid through the bind mount.
    - name: Brand image files
      ansible.posix.synchronize:
        src: "{{ teamcraft_server_brand_assets_src | regex_replace('/*$', '') }}/"
        dest: /home/tc-server/brands/
        delete: true
        recursive: true
        rsync_opts: ["--chmod=D0755,F0644", "--chown=tc-server:tc-server"]
      register: teamcraft_server_brand_assets

- name: Quadlet unit
  ansible.builtin.template:
    src: teamcraft-server.container.j2
    dest: /home/tc-server/.config/containers/systemd/teamcraft-server.container
    owner: tc-server
    group: tc-server
    mode: "0644"
  register: teamcraft_server_unit

- name: Restart on change
  ansible.builtin.include_role:
    name: base
    tasks_from: service_changed
  vars:
    base_service_name: teamcraft-server
    base_service_changed: >-
      {{ teamcraft_server_unit.changed or teamcraft_server_config.changed or base_service_secrets_changed
         or (teamcraft_server_web_archive.changed | default(false))
         or (teamcraft_server_brand_assets.changed | default(false)) }}
