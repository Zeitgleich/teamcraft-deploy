name: teamcraft

services:
  caddy:
    image: caddy:${CADDY_VERSION}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - teamcraft-server

  teamcraft-server:
    image: ${TEAMCRAFT_IMAGE_REGISTRY}/teamcraft-server:${TEAMCRAFT_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      TEAMCRAFT_DATABASE__URL: postgres://teamcraft:${POSTGRES_PASSWORD}@postgres:5432/teamcraft
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/teamcraft-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  teamcraft-sfu:
    image: ${TEAMCRAFT_IMAGE_REGISTRY}/teamcraft-sfu:${TEAMCRAFT_VERSION}
    restart: unless-stopped
    env_file: .env
    ports:
      - "4433:4433/udp"
    volumes:
      - caddy-data:/certs:ro # reuses the certificate Caddy obtained for the SFU host name

  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: teamcraft
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamcraft"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
