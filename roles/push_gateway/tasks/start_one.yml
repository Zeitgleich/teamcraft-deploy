- name: "Running: {{ push_gateway_item.name }}"
  ansible.builtin.systemd_service:
    name: "{{ push_gateway_item.name }}.service"
    state: "{{ 'restarted' if push_gateway_item.name in (base_restart_needed | default([])) else 'started' }}"
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ push_gateway_item.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[push_gateway_item.user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[push_gateway_item.user][1] }}/bus"
