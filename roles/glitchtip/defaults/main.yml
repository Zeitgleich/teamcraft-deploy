# Optional error tracking for the apps' crash reports: GlitchTip (Sentry protocol), rootless as
# tc-glitchtip, behind the proxy at glitchtip_hostname (group_vars/teamcraft_servers.yml). Three units:
# glitchtip-valkey (task queue and cache), glitchtip-web (UI, API, event intake; migrates the database
# on start) and glitchtip-worker (one process, scheduler inside). Database `glitchtip` in the bundled
# Postgres. Any other Sentry-protocol backend works as well: the apps only know a DSN
# (docs/components/glitchtip.md).
glitchtip_enabled: false
# true on a host that runs only GlitchTip (group teamcraft_crash_reports, set in its group_vars): the role
# then writes the configurations for the web server in front itself, to
# teamcraft_proxy_snippets_dir/glitchtip/ (Plesk, Apache, nginx).
glitchtip_standalone: false
# https://glitchtip.com/blog/ announces new major versions; read it before moving this.
glitchtip_image: "docker.io/glitchtip/glitchtip:6.2.6"
glitchtip_valkey_image: "docker.io/valkey/valkey:9.1.3-alpine3.24"

# About 1 GB together: one web process, one worker process with few concurrent tasks.
glitchtip_web_memory: 512m
glitchtip_worker_memory: 512m
glitchtip_valkey_memory: 128m
# Valkey's own limit, below the container's. It evicts nothing: queued tasks must not vanish.
glitchtip_valkey_maxmemory: 96mb
# Tasks the worker runs at once (VTASKS_CONCURRENCY), and the web server's processes (GRANIAN_WORKERS).
glitchtip_worker_concurrency: 4
glitchtip_web_processes: 1

# The superuser the playbook creates on the first run, so nobody else can register first. Its
# password is the generated secret glitchtip_admin_password (/srv/teamcraft/secrets on the host).
glitchtip_admin_email: "{{ teamcraft_admin_email }}"
# Sender of GlitchTip's mail (alerts, invitations, password resets).
glitchtip_from_email: "{{ glitchtip_admin_email }}"
# Outgoing mail as a URL, e.g. smtp+tls://user:password@mail.example.com:587 (STARTTLS) or
# smtp+ssl://...:465; URL-encode the password. Holds a password: put it in the sops file as
# glitchtip_email_url. Empty: mail is only written to the log (consolemail://).
glitchtip_email_url: "{{ base_secrets.glitchtip_email_url | default('') }}"

# Closed by default: only the superuser and the people it invites have accounts, and only superusers
# create organizations.
glitchtip_user_registration: false
glitchtip_organization_creation: false

# Events, logs, uploaded debug files and uptime results are deleted after this many days
# (GLITCHTIP_RETENTION_DAYS, which replaces GLITCHTIP_MAX_EVENT_LIFE_DAYS).
glitchtip_retention_days: 30
# Uptime monitoring makes GlitchTip request URLs from this host; log ingestion takes logs over the
# Sentry protocol. Neither is needed for crash reports; both cost memory.
glitchtip_uptime_enabled: false
glitchtip_logs_enabled: false

# Spans of performance transactions (GLITCHTIP_ENABLE_DUCKDB): GlitchTip stages them in Postgres and the
# worker's scheduler moves them every 5 minutes into Parquet files (cold storage), which the "Span
# breakdown" of a transaction group reads with DuckDB. Off: transactions are kept, their spans are not
# shown. The files go to the volume glitchtip-cold-storage, or with glitchtip_s3_endpoint to
# cold_storage/ in glitchtip_s3_bucket.
glitchtip_duckdb_enabled: true
# Raw spans are deleted after this many days (GLITCHTIP_SPAN_RAW_RETENTION_DAYS); the hourly trend rollups
# of the span groups stay longer.
glitchtip_span_raw_retention_days: 30

# Uploaded debug files (symbols, source maps) are kept in the volume glitchtip-uploads. Set an
# endpoint to keep them in an S3 bucket instead (e.g. a bucket of the bundled Garage, garage_extra_buckets);
# the keys go in the sops file as glitchtip_s3_access_key / glitchtip_s3_secret_key.
glitchtip_s3_endpoint: ""
glitchtip_s3_bucket: glitchtip
glitchtip_s3_access_key: "{{ base_secrets.glitchtip_s3_access_key | default('') }}"
glitchtip_s3_secret_key: "{{ base_secrets.glitchtip_s3_secret_key | default('') }}"

# Organization roles from the identity provider (docs/components/glitchtip.md, "Sign-in with SSO and
# roles"). GlitchTip adds people who sign in through an organization's SSO app as members and maps no
# roles. With a claim name here, a timer of tc-glitchtip sets each SSO user's role in that organization
# from the claim (a list or a string of values), as the claims were at the user's last SSO sign-in. Empty:
# no sync.
glitchtip_sso_role_claim: ""
# Claim value -> GlitchTip organization role (owner, manager, admin, member); the highest one wins.
glitchtip_sso_role_map:
  owner: owner
  manager: manager
  admin: admin
  member: member
# true: remove SSO users whose claim maps to no role from the organization (never its last owner).
glitchtip_sso_remove_without_role: true
# systemd time span between two runs.
glitchtip_sso_role_sync_interval: 5min

# Extra environment of the web and worker containers (install docs: https://glitchtip.com/documentation/install),
# e.g. {LOG_LEVEL: INFO}. Not for secrets.
glitchtip_extra_environment: {}

# Podman secrets of GlitchTip (empty ones are left out).
glitchtip_secrets:
  glitchtip_secret_key: "{{ base_secrets.glitchtip_secret_key }}"
  glitchtip_database_url: >-
    postgres://glitchtip:{{ base_secrets.glitchtip_db_password }}@127.0.0.1:{{ teamcraft_ports.postgres }}/glitchtip
  glitchtip_valkey_url: "redis://:{{ base_secrets.glitchtip_valkey_password }}@127.0.0.1:{{ teamcraft_ports.glitchtip_valkey }}/0"
  glitchtip_valkey_config: |
    requirepass {{ base_secrets.glitchtip_valkey_password }}
  glitchtip_email_url: "{{ glitchtip_email_url }}"
  glitchtip_s3_access_key: "{{ glitchtip_s3_access_key if glitchtip_s3_endpoint | length > 0 else '' }}"
  glitchtip_s3_secret_key: "{{ glitchtip_s3_secret_key if glitchtip_s3_endpoint | length > 0 else '' }}"
