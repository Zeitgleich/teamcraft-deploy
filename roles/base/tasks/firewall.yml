- name: Firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload the firewall

- name: Firewall enabled
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true
    state: started
