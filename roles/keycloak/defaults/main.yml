# Bundled identity provider: Keycloak, rootless as tc-keycloak, database in the bundled Postgres,
# behind Caddy at keycloak_hostname. Disable it to use an existing OIDC provider
# (docs/components/keycloak.md). keycloak_enabled and keycloak_hostname: group_vars/teamcraft_servers.yml.
keycloak_image: "quay.io/keycloak/keycloak:26.7.5"
keycloak_memory: 1g
keycloak_realm: teamcraft
keycloak_realm_display_name: TeamCraft
# Redirect URIs of the apps besides the web client and the desktop app's loopback callback, e.g. the
# mobile apps' custom scheme ("<scheme>:/oauth/callback", apps/android/README.md).
keycloak_extra_redirect_uris: []
# The admin console and the admin API are not published through Caddy by default; reach them through
# an SSH tunnel to 127.0.0.1:{{ teamcraft_ports.keycloak }} (docs/components/keycloak.md).
keycloak_admin_console_public: false
# Access token lifetime in seconds.
keycloak_access_token_lifespan: 300
# The web client on every host name (brands included), the desktop app's loopback login (any port,
# RFC 8252) and the extra ones above. Kept in sync on every run, also after the first import.
keycloak_redirect_uris: >-
  {{ teamcraft_web_hostnames | map('regex_replace', '^', 'https://') | map('regex_replace', '$', '/*') | list
     + ['http://127.0.0.1/callback', 'http://[::1]/callback'] + keycloak_extra_redirect_uris }}
keycloak_web_origins: "{{ teamcraft_web_hostnames | map('regex_replace', '^', 'https://') | list }}"
# Organization badge (teamcraft_oidc_organization_claim): a token mapper from this user attribute to
# that claim. Empty: no mapper (set one up yourself, or leave organizations out).
keycloak_organization_attribute: ""
