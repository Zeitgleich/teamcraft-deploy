- name: Install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [setup-all, install-all, setup-dex, install-dex]
  when: dex_enabled
  tags: [setup-all, install-all, setup-dex, install-dex]

- name: Uninstall
  ansible.builtin.include_role:
    name: base
    tasks_from: service_remove
    apply:
      tags: [setup-all, setup-dex]
  vars:
    base_service_name: dex
    base_service_user: tc-dex
  when: not dex_enabled
  tags: [setup-all, setup-dex]
