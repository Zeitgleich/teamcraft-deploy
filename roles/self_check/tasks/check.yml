- name: Users
  ansible.builtin.getent:
    database: passwd

- name: Services are active
  # noqa: command-instead-of-module  # the module can't fail a check on an inactive unit by itself
  ansible.builtin.command: systemctl --user is-active {{ item.name }}.service
  become: true
  become_user: "{{ item.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[item.user][1] }}"
  loop: "{{ teamcraft_services | selectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: SFU listens on IPv4 and IPv6 (dual-stack socket)
  ansible.builtin.shell: |
    set -o pipefail
    ss -Hlun "sport = :{{ teamcraft_ports.sfu }}" | grep -E '\[::\]|\*:'
  args:
    executable: /bin/bash
  when: teamcraft_sfu_enabled
  changed_when: false

- name: Public endpoints, from the control machine
  ansible.builtin.uri:
    url: "{{ item }}"
    validate_certs: "{{ self_check_validate_certs }}"
  delegate_to: localhost
  become: false
  loop: "{{ (['https://' ~ teamcraft_domain ~ '/readyz'] if teamcraft_server_enabled else [])
            + (['https://' ~ keycloak_hostname ~ '/realms/' ~ keycloak_realm ~ '/.well-known/openid-configuration'] if keycloak_enabled else [])
            + ([teamcraft_oidc_issuer ~ '/.well-known/openid-configuration'] if teamcraft_server_enabled and not keycloak_enabled else [])
            + (['https://' ~ glitchtip_hostname ~ '/_health/'] if glitchtip_enabled else []) }}"

- name: Internal API is not reachable from outside
  ansible.builtin.uri:
    url: "https://{{ teamcraft_domain }}/api/internal/v1/calls/participants/joined"
    method: POST
    # 404 from Caddy and the nginx configuration; 403 from Apache's and Traefik's.
    status_code: [403, 404]
    validate_certs: "{{ self_check_validate_certs }}"
  delegate_to: localhost
  become: false
  when: teamcraft_server_enabled

# The WebSocket for clients whose network blocks UDP: the proxy must hand the upgrade to the SFU. 101:
# the SFU took it (and closes it after 3 s without a join); 401: the SFU too, with
# TEAMCRAFT_SFU_FALLBACK_REQUIRE_UPGRADE_TOKEN=1. 200 or 404: the request ended at the proxy or the chat
# server, or the SFU is older than the /call/ws path (TeamCraft#TBD); 502/504: the proxy can't reach the
# SFU's port.
- name: Call fallback reaches the SFU through the proxy
  ansible.builtin.uri:
    url: "https://{{ teamcraft_sfu_hostname }}/call/ws"
    headers:
      Connection: Upgrade
      Upgrade: websocket
      Sec-WebSocket-Version: "13"
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
    status_code: [101, 401]
    timeout: 15
    validate_certs: "{{ self_check_validate_certs }}"
  delegate_to: localhost
  become: false
  when: teamcraft_sfu_enabled and teamcraft_server_enabled

- name: S3 endpoint answers
  ansible.builtin.uri:
    url: "{{ teamcraft_s3_endpoint }}"
    status_code: [200, 403]
    validate_certs: "{{ self_check_validate_certs }}"
  delegate_to: localhost
  become: false
  when: teamcraft_server_enabled

- name: All good
  ansible.builtin.debug:
    msg: >-
      {{ ('TeamCraft at https://' ~ teamcraft_domain) if teamcraft_server_enabled
         else ('GlitchTip at https://' ~ glitchtip_hostname) }} looks healthy.
