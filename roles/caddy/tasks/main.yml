- name: Install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [setup-all, install-all, setup-caddy, install-caddy]
  when: caddy_enabled
  tags: [setup-all, install-all, setup-caddy, install-caddy]

- name: Uninstall
  ansible.builtin.include_tasks:
    file: uninstall.yml
    apply:
      tags: [setup-all, setup-caddy]
  when: not caddy_enabled
  tags: [setup-all, setup-caddy]
