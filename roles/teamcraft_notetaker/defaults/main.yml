# The notetaker (an AI participant people can ask into a call: it transcribes the call through
# OpenRouter and posts a summary and the transcript), rootless as tc-notetaker. It listens on no port:
# it connects out to the server, the SFU (QUIC/UDP) and OpenRouter (docs/components/teamcraft-notetaker.md,
# docs/admin.md §3.7 of the TeamCraft repository). Off by default: it sends call audio out of the
# end-to-end encryption, and it needs a bot an admin creates in the console, whose token goes into the
# sops file as notetaker_bot_token.
teamcraft_notetaker_enabled: false
teamcraft_notetaker_image: "{{ teamcraft_image_registry }}/teamcraft-notetaker:{{ teamcraft_version }}"
teamcraft_notetaker_memory: 1g
teamcraft_notetaker_log_filter: info

# The server the bot signs in to, through the proxy like any client.
teamcraft_notetaker_server_url: "https://{{ teamcraft_domain }}"
# The bot's device name, shown in the conversations' member and device lists.
teamcraft_notetaker_device_name: "{{ teamcraft_domain }} notetaker"

# Whether it may join calls, who may add it, the models, the language, the summary instructions and the
# OpenRouter key are the owner-signed workspace policy (Administration -> Notetaker), not set here.
# The key is normally stored there (the server needs its settings_key, which the base role generates).
# To keep it on this host instead, put it in the sops file as notetaker_openrouter_api_key (and enter it
# in the console all the same, which signs only its hash).
teamcraft_notetaker_openrouter_base_url: https://openrouter.ai/api/v1
teamcraft_notetaker_openrouter_request_timeout_secs: 120
teamcraft_notetaker_openrouter_max_retries: 4
teamcraft_notetaker_openrouter_max_concurrent_requests: 4

# [limits]: it leaves a call after max_call_minutes and posts what it has, and leaves a call where nobody
# else has been for alone_timeout_secs. Calls in progress get shutdown_drain_secs at a restart.
teamcraft_notetaker_max_call_minutes: 240
teamcraft_notetaker_alone_timeout_secs: 60
teamcraft_notetaker_shutdown_drain_secs: 60

# [health]: `teamcraft-notetaker healthcheck` fails when the worker's liveness file is older than this
# (at least 30; the worker rewrites it every 10 seconds).
teamcraft_notetaker_health_max_age_secs: 120

# Podman secrets of the notetaker (empty ones are left out). The bot token and the OpenRouter key can't
# be generated; the database key and the recovery passphrase are (base role).
teamcraft_notetaker_secrets:
  notetaker_bot_token: "{{ base_secrets.notetaker_bot_token | default('') }}"
  notetaker_store_key: "{{ base_secrets.notetaker_store_key }}"
  notetaker_passphrase: "{{ base_secrets.notetaker_passphrase }}"
  notetaker_openrouter_api_key: "{{ base_secrets.notetaker_openrouter_api_key | default('') }}"
