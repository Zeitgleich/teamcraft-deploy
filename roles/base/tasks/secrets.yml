# Generated once on the host, then read on every run. Values from base_secrets_sops_file win.
- name: Secrets directory
  ansible.builtin.file:
    path: "{{ base_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate missing secrets
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    case "{{ item.kind }}" in
      hex) openssl rand -hex 32 | tr -d '\n' ;;
      token) openssl rand -base64 48 | tr -d '\n' ;;
      base64url32) openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n' ;;
      ed25519) openssl genpkey -algorithm ed25519 ;;
      garage_key_id) printf 'GK%s' "$(openssl rand -hex 12)" ;;
      *) echo "unknown secret kind {{ item.kind }}" >&2; exit 1 ;;
    esac > "{{ base_secrets_dir }}/{{ item.name }}.new"
    mv "{{ base_secrets_dir }}/{{ item.name }}.new" "{{ base_secrets_dir }}/{{ item.name }}"
  args:
    executable: /bin/bash
    creates: "{{ base_secrets_dir }}/{{ item.name }}"
  loop: "{{ base_generated_secrets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Public key of the call signing key
  ansible.builtin.shell: |
    set -eu
    umask 022
    openssl pkey -in "{{ base_secrets_dir }}/call_signing_key" -pubout > "{{ base_secrets_dir }}/call_signing_public_key"
  args:
    creates: "{{ base_secrets_dir }}/call_signing_public_key"

- name: Read the secrets
  ansible.builtin.slurp:
    src: "{{ base_secrets_dir }}/{{ item }}"
  loop: "{{ base_generated_secrets | map(attribute='name') | list + ['call_signing_public_key'] }}"
  register: base_secrets_read
  no_log: true

- name: Secrets from the sops file
  ansible.builtin.set_fact:
    base_secrets_sops: "{{ lookup('community.sops.sops', base_secrets_sops_file) | from_yaml }}"
  when: base_secrets_sops_file | length > 0
  no_log: true

- name: Secrets
  ansible.builtin.set_fact:
    base_secrets: >-
      {{ dict(base_secrets_read.results | map(attribute='item')
              | zip(base_secrets_read.results | map(attribute='content') | map('b64decode')))
         | combine(base_secrets_sops | default({})) }}
  no_log: true
