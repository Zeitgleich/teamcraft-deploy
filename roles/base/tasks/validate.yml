- name: Required settings are set
  ansible.builtin.assert:
    that:
      - teamcraft_domain is defined and teamcraft_domain | length > 0 and teamcraft_domain != 'chat.example.com'
      - teamcraft_admin_email is defined and '@' in teamcraft_admin_email
      - keycloak_enabled or teamcraft_oidc_issuer | length > 0
      - garage_enabled or teamcraft_s3_endpoint | length > 0
    fail_msg: >-
      Set teamcraft_domain and teamcraft_admin_email in inventory/host_vars/<host>/vars.yml, and
      teamcraft_oidc_issuer / teamcraft_s3_endpoint when the bundled Keycloak / Garage are disabled
      (examples/vars.yml, docs/configuring.md).
    quiet: true

- name: Debian 13 or Ubuntu 24.04 or newer
  ansible.builtin.assert:
    that: >-
      (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int >= 13)
      or (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] | int >= 24)
    fail_msg: >-
      The playbook supports Debian 13 (trixie) and Ubuntu 24.04 and newer, not {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}.
    quiet: true

# A partial teamcraft_ports in vars.yml (only the ports you move) gets the defaults for the rest.
# The shared setting every role reads, completed here once (hence no base_ prefix).
- name: Ports  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    teamcraft_ports: "{{ teamcraft_port_defaults | combine(teamcraft_ports) }}"


- name: Brands are consistent
  ansible.builtin.assert:
    that:
      - teamcraft_brands | selectattr('is_default', 'defined') | selectattr('is_default') | list | length == 1
      - teamcraft_brands | map(attribute='id') | unique | list | length == teamcraft_brands | length
      - (teamcraft_brands | map(attribute='hostnames') | flatten | length) == (teamcraft_brands | map(attribute='hostnames') | flatten | unique | length)
      - teamcraft_domain in (teamcraft_brands | map(attribute='hostnames') | flatten)
    fail_msg: >-
      teamcraft_brands: exactly one brand with is_default: true, unique ids, every host name in one brand
      only, and teamcraft_domain among them (docs/components/branding.md).
    quiet: true
  when: teamcraft_brands | length > 0

- name: The SFU has a certificate
  ansible.builtin.assert:
    that: caddy_enabled or teamcraft_sfu_certificate_external | bool
    fail_msg: >-
      Without Caddy the SFU needs an existing certificate for {{ teamcraft_sfu_hostname }}: set
      teamcraft_sfu_certificate_path (and _key_path), or teamcraft_sfu_certificate_nginx_conf on Plesk
      (docs/reverse-proxy.md).
    quiet: true
  when: teamcraft_sfu_enabled
