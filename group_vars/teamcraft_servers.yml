# Wiring between the components. Lower precedence than inventory/host_vars, so anything here can be
# overridden per host. Defaults of each component are in roles/<component>/defaults/main.yml.

# TeamCraft version: images are pulled with this tag (just update moves it to the playbook's
# release; docs/updating.md).
teamcraft_version: "1.0.0"
teamcraft_image_registry: ghcr.io/zeitgleich

# Reverse proxy: the bundled Caddy (TLS for every host name on 80/443), or false for one you already
# run (nginx, Apache, Plesk, Traefik, HAProxy, another Caddy): the playbook then binds nothing public
# but the SFU's UDP port and writes ready-made proxy configurations to teamcraft_proxy_snippets_dir
# (docs/reverse-proxy.md).
caddy_enabled: true
# The loopback address the proxied services (server, Keycloak, Garage's S3 API, CalCraft) listen on and
# are reached at: 127.0.0.1 or ::1. One address: each service binds a single socket.
teamcraft_upstream_address: 127.0.0.1
# The same as it goes into URLs and host:port pairs ([::1] for IPv6).
teamcraft_upstream_host: "{{ ('[' ~ teamcraft_upstream_address ~ ']') if ':' in teamcraft_upstream_address else teamcraft_upstream_address }}"
# Addresses of the proxy as the server sees it: its X-Forwarded-Host replaces Host (brands). Caddy
# passes Host unchanged; an external proxy on this host connects from loopback.
teamcraft_trusted_proxies: "{{ [] if caddy_enabled else ['127.0.0.1', '::1'] }}"

# The SFU's certificate (QUIC on udp/3478 terminates in the SFU, no HTTP proxy can do it). With Caddy
# it is Caddy's certificate for teamcraft_sfu_hostname. Without Caddy, or to use another certificate,
# name existing files (certbot: /etc/letsencrypt/live/<sfu host>/fullchain.pem and privkey.pem; key and
# certificate may also be one file), or the nginx configuration that names them (Plesk:
# /var/www/vhosts/system/<sfu host>/conf/last_nginx.conf, whose file names change on every renewal).
# A root timer copies them for tc-sfu when they change; the SFU restarts (docs/reverse-proxy.md).
teamcraft_sfu_certificate_path: ""
teamcraft_sfu_certificate_key_path: "{{ teamcraft_sfu_certificate_path }}"
teamcraft_sfu_certificate_nginx_conf: ""
teamcraft_sfu_certificate_external: >-
  {{ teamcraft_sfu_certificate_path | length > 0 or teamcraft_sfu_certificate_nginx_conf | length > 0 }}

# Without Caddy: proxy configurations filled in with this host's names and ports, written to the server
# for you to copy (nginx, Apache, Plesk, HAProxy, Traefik, Caddy; docs/reverse-proxy.md). The proxy's
# certificate files per host name ({host} is replaced), e.g. certbot's:
teamcraft_proxy_snippets_dir: "{{ teamcraft_base_dir }}/reverse-proxy"
teamcraft_proxy_certificate_path: "/etc/letsencrypt/live/{host}/fullchain.pem"
teamcraft_proxy_certificate_key_path: "/etc/letsencrypt/live/{host}/privkey.pem"

# Checks before anything is installed: ports already taken by other software (80/443 with Caddy, the
# loopback ports of the services, the SFU's UDP port), and a Plesk firewall the playbook's would replace.
teamcraft_preflight_enabled: true

# Host names
teamcraft_sfu_hostname: "sfu.{{ teamcraft_domain }}"
keycloak_hostname: "id.{{ teamcraft_domain }}"
garage_hostname: "s3.{{ teamcraft_domain }}"
calcraft_hostname: "cal.{{ teamcraft_domain }}"

# Identity provider: bundled Keycloak unless disabled.
keycloak_enabled: true
teamcraft_oidc_issuer: "{{ ('https://' ~ keycloak_hostname ~ '/realms/' ~ keycloak_realm) if keycloak_enabled else '' }}"
teamcraft_oidc_client_id: teamcraft
# Confidential client of the TeamCraft server (deprovisioning sync).
teamcraft_oidc_server_client: teamcraft-server
# Scopes the apps ask for at sign-in. `offline_access` gives every device a long-lived refresh token,
# so people stay signed in instead of following the provider's browser session (often 8-10 hours).
teamcraft_oidc_app_scopes: ["openid", "profile", "email", "offline_access"]

# Storage: bundled Garage unless disabled.
garage_enabled: true
teamcraft_s3_endpoint: "{{ ('https://' ~ garage_hostname) if garage_enabled else '' }}"
teamcraft_s3_region: "{{ garage_region if garage_enabled else 'us-east-1' }}"
teamcraft_s3_bucket: teamcraft
teamcraft_s3_path_style: "{{ garage_enabled }}"
teamcraft_s3_access_key: "{{ base_secrets.garage_access_key if garage_enabled else (base_secrets.s3_access_key | default('')) }}"
teamcraft_s3_secret_key: "{{ base_secrets.garage_secret_key if garage_enabled else (base_secrets.s3_secret_key | default('')) }}"

# Outgoing mail (meeting invitations, space invitations): off until an SMTP relay is configured
# (docs/components/mail.md).
teamcraft_smtp_enabled: false
# The password: secret smtp_password (sops file) or teamcraft_smtp_password.
teamcraft_smtp_host: ""
teamcraft_smtp_port: 587
# start_tls, tls (port 465) or none (local relay only)
teamcraft_smtp_security: start_tls
teamcraft_smtp_username: ""
teamcraft_smtp_password: "{{ base_secrets.smtp_password | default('') }}"
teamcraft_mail_from: "{{ teamcraft_admin_email }}"

# Calendar for meetings (CalDAV): the bundled CalCraft, or an external server.
teamcraft_caldav_calendar_url: >-
  {{ ('http://' ~ teamcraft_upstream_host ~ ':' ~ teamcraft_ports.calcraft ~ '/dav/calendars/teamcraft/default/') if calcraft_enabled else '' }}
teamcraft_caldav_username: teamcraft
teamcraft_caldav_password: "{{ base_secrets.calcraft_password if calcraft_enabled else (base_secrets.caldav_password | default('')) }}"


# Ports on the host. Only Caddy (80, 443) and the SFU are public; everything else is loopback (the
# bridge's webhooks are reached through the proxy, under /hooks/ and /ingest/). Change
# any that other software on the host already uses (the preflight checks say which).
teamcraft_port_defaults:
  postgres: 5432
  server: 8080
  sfu: 3478
  sfu_control: 8081
  keycloak: 8180
  keycloak_management: 9180
  garage_s3: 3900
  garage_rpc: 3901
  garage_admin: 3903
  calcraft: 5232
  bridge: 8088
# Set only the ones you change, e.g. teamcraft_ports: {postgres: 13100, server: 13101}: the base role
# fills in the rest from teamcraft_port_defaults.
teamcraft_ports: "{{ teamcraft_port_defaults }}"

# Services in start order (stop runs it backwards): unit, user, whether it is enabled.
teamcraft_services:
  - {name: postgres, user: tc-db, enabled: "{{ postgres_enabled }}"}
  - {name: garage, user: tc-garage, enabled: "{{ garage_enabled }}"}
  - {name: keycloak, user: tc-keycloak, enabled: "{{ keycloak_enabled }}"}
  - {name: caddy, user: tc-proxy, enabled: "{{ caddy_enabled }}"}
  - {name: teamcraft-server, user: tc-server, enabled: "{{ teamcraft_server_enabled }}"}
  - {name: teamcraft-sfu, user: tc-sfu, enabled: "{{ teamcraft_sfu_enabled }}"}
  - {name: teamcraft-bridge, user: tc-bridge, enabled: "{{ teamcraft_bridge_enabled }}"}
  - {name: calcraft, user: tc-calcraft, enabled: "{{ calcraft_enabled }}"}

# Shared directories
teamcraft_base_dir: /srv/teamcraft
teamcraft_cert_dir: "{{ teamcraft_base_dir }}/certs"
teamcraft_backup_dir: "{{ teamcraft_base_dir }}/backups"

# Ports 80/443 for unprivileged users only for the bundled Caddy.
base_unprivileged_web_ports: "{{ caddy_enabled }}"

# Brands (docs/components/branding.md): several host names, each with its own name, logo, colors and
# mail identity, all served by the one TeamCraft server. Empty: the single built-in brand on
# teamcraft_domain. Brand data is your own: keep it in your inventory.
teamcraft_brands: []
# Every host name the server answers on: teamcraft_domain plus those of the brands.
teamcraft_web_hostnames: "{{ ([teamcraft_domain] + (teamcraft_brands | map(attribute='hostnames') | flatten)) | unique }}"
# Optional: access-token claim with the user's organization ([oidc] organization_claim).
teamcraft_oidc_organization_claim: ""

# Push gateway for the store apps (docs/components/push-gateway.md): the iOS and Android store apps
# can only be pushed to with their publisher's credentials, which a push gateway holds. Set the URL of
# the publisher's gateway (default: the one of the official apps); the server key is generated like the
# other secrets. Set it empty for no gateway, e.g. with self-built apps that use your own credentials
# (teamcraft_server_extra_config with [push.apns] / [push.fcm]).
teamcraft_push_gateway_url: https://push-gw.zeitgleich.de
# The apps seal their device token for the gateway, bound to this server (docs/components/push-gateway.md).
# true: also accept raw tokens from old apps that don't seal yet (a transition; the gateway must allow it
# too, and a raw token can be used by any server that learns it).
teamcraft_push_gateway_accept_unbound_tokens: false
