- name: Install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [setup-all, install-all, setup-teamcraft-notetaker, install-teamcraft-notetaker]
  when: teamcraft_notetaker_enabled
  tags: [setup-all, install-all, setup-teamcraft-notetaker, install-teamcraft-notetaker]

- name: Uninstall
  ansible.builtin.include_role:
    name: base
    tasks_from: service_remove
    apply:
      tags: [setup-all, setup-teamcraft-notetaker]
  vars:
    base_service_name: teamcraft-notetaker
    base_service_user: tc-notetaker
  when: not teamcraft_notetaker_enabled
  tags: [setup-all, setup-teamcraft-notetaker]
