name: CI

# Lint on every push and pull request; the end-to-end dry run (test/dry-run.sh) on pull requests,
# nightly and on demand. The dry run builds the TeamCraft images from the app repository's main
# branch (or the ref given when started by hand).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      teamcraft_ref:
        description: TeamCraft ref to build the images and the e2e harness from
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANSIBLE_LINT_VERSION: "26.10.1"
  YAMLLINT_VERSION: "1.38.0"

jobs:
  lint:
    name: yamllint + ansible-lint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Linters
        run: pip install "ansible-lint==${ANSIBLE_LINT_VERSION}" "yamllint==${YAMLLINT_VERSION}"
      - name: Collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint --strict .
      - name: ansible-lint (production profile)
        run: ansible-lint
      - name: shellcheck
        run: shellcheck test/dry-run.sh test/gateway-dry-run.sh

  dry-run:
    name: Dry run (systemd container target)
    if: github.event_name != 'push'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      TEAMCRAFT_REPO: ${{ github.workspace }}/teamcraft
    steps:
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zeitgleich/TeamCraft
          ref: ${{ inputs.teamcraft_ref || 'main' }}
          path: teamcraft
          # While the TeamCraft repository is private: a read-only token for it in this secret.
          token: ${{ secrets.TEAMCRAFT_READ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: teamcraft
      - name: System packages (e2e harness build)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev cmake pkg-config libssl-dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Ansible
        working-directory: deploy
        # websockets: test/gateway-check.py (external proxy variant)
        run: pip install ansible-core websockets && ansible-galaxy collection install -r requirements.yml
      - name: Dry run (with two brands)
        working-directory: deploy
        env:
          DRY_RUN_BRANDS: "1"
        run: test/dry-run.sh all
      - name: Dry run behind nginx (no Caddy, SFU certificate as Plesk keeps it)
        working-directory: deploy
        env:
          DRY_RUN_PROXY: nginx
          # The e2e harness ran in the step before; this one checks the proxy, gateway and SFU certificate.
          DRY_RUN_SKIP_E2E: "1"
        run: test/dry-run.sh down && test/dry-run.sh all
      - name: Logs of the target on failure
        if: failure()
        run: |
          docker exec tc-dryrun-target sh -c 'for u in tc-db tc-garage tc-keycloak tc-proxy tc-server tc-sfu; do
            echo "== $u"; XDG_RUNTIME_DIR=/run/user/$(id -u $u) runuser -u $u -- journalctl --user -n 80 --no-pager; done' || true
      - name: Remove the target
        if: always()
        working-directory: deploy
        run: test/dry-run.sh down

  gateway-dry-run:
    name: Push gateway behind Apache (Ubuntu 24.04 target)
    if: github.event_name != 'push'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GATEWAY_REPO: ${{ github.workspace }}/teamcraft-push-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zeitgleich/teamcraft-push-gateway
          path: teamcraft-push-gateway
          token: ${{ secrets.TEAMCRAFT_READ_TOKEN || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Ansible
        working-directory: deploy
        run: pip install ansible-core && ansible-galaxy collection install -r requirements.yml
      - name: Dry run
        working-directory: deploy
        run: test/gateway-dry-run.sh all
      - name: Remove the target
        if: always()
        working-directory: deploy
        run: test/gateway-dry-run.sh down
