# Helper: start a service now (restarting it when it changed), for components that later install
# steps need running (postgres, garage, keycloak). In: base_service_name, base_service_user
- name: "Running: {{ base_service_name }}"
  ansible.builtin.systemd_service:
    name: "{{ base_service_name }}.service"
    state: "{{ 'restarted' if base_service_name in (base_restart_needed | default([])) else 'started' }}"
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ base_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ base_service_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ base_service_uid }}/bus"

- name: "Restart done: {{ base_service_name }}"
  ansible.builtin.set_fact:
    base_restart_needed: "{{ base_restart_needed | default([]) | difference([base_service_name]) }}"
