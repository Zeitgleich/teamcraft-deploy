- name: Users
  ansible.builtin.getent:
    database: passwd

- name: Each service
  ansible.builtin.include_tasks: start_one.yml
  loop:
    - {name: teamcraft-push-gateway, user: tc-gateway}
    - {name: push-gateway-caddy, user: tc-gwproxy}
  loop_control:
    loop_var: push_gateway_item
    label: "{{ push_gateway_item.name }}"
