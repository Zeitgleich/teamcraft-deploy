teamcraft_domain: chat.example.com
teamcraft_sfu_domain: sfu.chat.example.com
teamcraft_acme_email: admin@example.com

# Pinned versions. TeamCraft images by digest, set per release.
teamcraft_image_registry: ghcr.io/example
teamcraft_server_digest: "sha256:replace-with-release-digest"
teamcraft_sfu_digest: "sha256:replace-with-release-digest"
postgres_version: "18.6-alpine3.23"
caddy_version: "2.11.7"

teamcraft_oidc_client_id: teamcraft
teamcraft_oidc_server_client: teamcraft-server
teamcraft_oidc_roles:
  owner: owner
  admin: admin
  member: member
  guest: guest
teamcraft_s3_bucket: teamcraft

# Decrypted on the control machine with sops (community.sops collection)
teamcraft_secrets_file: "{{ playbook_dir }}/../secrets/production.enc.yaml"
